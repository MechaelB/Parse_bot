services:
  redis:
    image: "redis:latest"
    container_name: "redis"
    ports:
      - "6379:6379"

  bot:
    build:
      context: ./bot
    container_name: "bot"
    volumes:
      - ./shared/uploads:/app/shared/uploads
      - ./shared/results:/app/shared/results
      - ./bot/.env:/app/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: always

  parser:
    build:
      context: ./parser
    container_name: "parser"
    volumes:
      - ./shared/uploads:/app/shared/uploads
      - ./shared/results:/app/shared/results
    depends_on:
      - redis
    restart: always
